services:
  # 1. FastAPI Unified Backend Service
  - type: web
    name: workflow-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: REQUEST_TIMEOUT_SECONDS
        value: 3.5
      - key: BUSINESS_TIMEZONE
        value: UTC
      - key: FRONTEND_ORIGIN
        value: "*"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 15
      - key: DATABASE_PATH
        value: "backend/data/users.db"

  # 2. React Vite Static Dashboard
  - type: web
    name: workflow-dashboard
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: workflow-backend
          property: host
